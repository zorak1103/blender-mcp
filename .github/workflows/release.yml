name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Patch version from tag
        run: python scripts/patch_version.py "${GITHUB_REF_NAME}"

      - name: Package addon zip
        run: zip -r "blender_mcp_addon-${GITHUB_REF_NAME}.zip" blender_addon/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "blender_mcp_addon-${{ github.ref_name }}.zip"
          generate_release_notes: true
