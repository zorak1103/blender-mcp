name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Patch version from tag
        run: python scripts/patch_version.py "${GITHUB_REF_NAME}"

      - name: Package addon zip
        run: zip -r "blender_mcp_addon-${GITHUB_REF_NAME}.zip" blender_addon/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "blender_mcp_addon-${{ github.ref_name }}.zip"
          generate_release_notes: true
