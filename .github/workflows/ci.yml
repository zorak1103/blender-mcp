name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv pip install ".[test]" ruff mypy --system

      - name: Install osv-scanner
        run: |
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan dependencies for CVEs
        run: osv-scanner scan source --lockfile uv.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy launcher.py

      - name: Unit tests
        run: pytest tests/unit/ -v --cov=blender_addon --cov=launcher --cov-fail-under=80
